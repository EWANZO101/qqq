{% extends "layouts/base.html" %}

{% block title %}Forgot Password - {{ site_name }}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 py-12">
    <div class="max-w-md w-full">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-500 to-purple-600 flex items-center justify-center mx-auto mb-4">
                <i data-lucide="lock" class="w-8 h-8 text-white"></i>
            </div>
            <h1 class="font-display text-3xl font-bold text-white mb-2">Forgot Password?</h1>
            <p class="text-gray-400">Enter your email to receive reset instructions</p>
        </div>

        <!-- Form -->
        <form method="POST" class="glass-card rounded-2xl p-8">
            <div class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">
                        Email Address
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="mail" class="w-5 h-5 text-gray-500"></i>
                        </div>
                        <input type="email" id="email" name="email" required
                               class="w-full bg-surface-800 border border-white/10 rounded-xl pl-12 pr-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500 transition-colors"
                               placeholder="your@email.com">
                    </div>
                </div>

                <button type="submit"
                        class="w-full py-3 rounded-xl bg-gradient-to-r from-primary-500 to-purple-600 hover:from-primary-400 hover:to-purple-500 text-white font-semibold transition-all duration-300 shadow-lg shadow-primary-500/25 hover:shadow-primary-500/40">
                    <i data-lucide="send" class="w-4 h-4 inline mr-2"></i>
                    Send Reset Link
                </button>
            </div>
        </form>

        <!-- Back to Login -->
        <div class="text-center mt-6">
            <a href="{{ url_for('auth.login') }}" class="text-gray-400 hover:text-white transition-colors inline-flex items-center">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
                Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
