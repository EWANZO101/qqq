{% extends "layouts/base.html" %}

{% block title %}Page Not Found - {{ site_name }}{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="text-center">
        <div class="w-24 h-24 rounded-full bg-yellow-500/20 flex items-center justify-center mx-auto mb-6">
            <i data-lucide="file-question" class="w-12 h-12 text-yellow-400"></i>
        </div>
        <h1 class="font-display text-6xl font-bold text-white mb-4">404</h1>
        <h2 class="text-2xl font-semibold text-gray-300 mb-4">Page Not Found</h2>
        <p class="text-gray-400 mb-8 max-w-md mx-auto">
            The page you're looking for doesn't exist or has been moved. Let's get you back on track.
        </p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="{{ url_for('main.index') }}" 
               class="px-6 py-3 rounded-xl bg-gradient-to-r from-primary-500 to-purple-600 hover:from-primary-400 hover:to-purple-500 text-white font-semibold transition-all duration-300 shadow-lg shadow-primary-500/25 hover:shadow-primary-500/40">
                <i data-lucide="home" class="w-4 h-4 inline mr-2"></i>
                Go Home
            </a>
            <a href="javascript:history.back()" 
               class="px-6 py-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white font-medium transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4 inline mr-2"></i>
                Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
