{% extends "layouts/base.html" %}

{% block title %}Server Error - {{ site_name }}{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="text-center">
        <div class="w-24 h-24 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-6">
            <i data-lucide="server-crash" class="w-12 h-12 text-red-400"></i>
        </div>
        <h1 class="font-display text-6xl font-bold text-white mb-4">500</h1>
        <h2 class="text-2xl font-semibold text-gray-300 mb-4">Server Error</h2>
        <p class="text-gray-400 mb-8 max-w-md mx-auto">
            Something went wrong on our end. We've been notified and are working to fix it. Please try again later.
        </p>
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
            <a href="{{ url_for('main.index') }}" 
               class="px-6 py-3 rounded-xl bg-gradient-to-r from-primary-500 to-purple-600 hover:from-primary-400 hover:to-purple-500 text-white font-semibold transition-all duration-300 shadow-lg shadow-primary-500/25 hover:shadow-primary-500/40">
                <i data-lucide="home" class="w-4 h-4 inline mr-2"></i>
                Go Home
            </a>
            <button onclick="location.reload()" 
                    class="px-6 py-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white font-medium transition-colors">
                <i data-lucide="refresh-cw" class="w-4 h-4 inline mr-2"></i>
                Try Again
            </button>
        </div>
    </div>
</div>
{% endblock %}
