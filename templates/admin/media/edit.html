{% extends "layouts/base.html" %}
{% block title %}Edit Media{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-white mb-8">Edit Media</h1>
    <form method="POST" class="glass-card rounded-2xl p-8 space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Title</label>
            <input type="text" name="title" value="{{ media.title }}" required class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Description</label>
            <textarea name="description" rows="3" class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white">{{ media.description or '' }}</textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Display Order</label>
            <input type="number" name="display_order" value="{{ media.display_order }}" class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white">
        </div>
        <div class="flex space-x-6">
            <label class="flex items-center">
                <input type="checkbox" name="is_published" {% if media.is_published %}checked{% endif %} class="w-4 h-4 rounded">
                <span class="ml-2 text-white">Published</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" name="is_featured" {% if media.is_featured %}checked{% endif %} class="w-4 h-4 rounded">
                <span class="ml-2 text-white">Featured</span>
            </label>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-primary-600 text-white font-semibold">Save Changes</button>
    </form>
</div>
{% endblock %}
