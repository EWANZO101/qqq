{% extends "layouts/base.html" %}
{% block title %}Upload Media{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-white mb-8">Upload Media</h1>
    <form method="POST" enctype="multipart/form-data" class="glass-card rounded-2xl p-8 space-y-6">
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Title *</label>
            <input type="text" name="title" required class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Description</label>
            <textarea name="description" rows="3" class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white"></textarea>
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Type</label>
            <select name="media_type" id="type" class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white">
                <option value="image">Image</option>
                <option value="video">Video</option>
                <option value="embed">YouTube Embed</option>
            </select>
        </div>
        <div id="file_upload">
            <label class="block text-sm font-medium text-gray-300 mb-2">File *</label>
            <input type="file" name="file" accept="image/*,video/*" class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white">
        </div>
        <div id="embed_url" style="display:none;">
            <label class="block text-sm font-medium text-gray-300 mb-2">YouTube URL</label>
            <input type="text" name="embed_url" class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Display Order</label>
            <input type="number" name="display_order" value="0" class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white">
        </div>
        <div class="flex space-x-6">
            <label class="flex items-center">
                <input type="checkbox" name="is_published" checked class="w-4 h-4 rounded">
                <span class="ml-2 text-white">Published</span>
            </label>
            <label class="flex items-center">
                <input type="checkbox" name="is_featured" class="w-4 h-4 rounded">
                <span class="ml-2 text-white">Featured</span>
            </label>
        </div>
        <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-primary-500 to-purple-600 text-white font-semibold">Upload</button>
    </form>
</div>
<script>
document.getElementById('type').addEventListener('change', function() {
    document.getElementById('file_upload').style.display = this.value === 'embed' ? 'none' : 'block';
    document.getElementById('embed_url').style.display = this.value === 'embed' ? 'block' : 'none';
});
</script>
{% endblock %}
