{% extends "layouts/base.html" %}

{% block title %}Settings - Admin - {{ site_name }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
        <div class="flex items-center space-x-3 mb-2">
            <a href="{{ url_for('admin.dashboard') }}" class="text-gray-400 hover:text-white transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <h1 class="font-display text-3xl font-bold text-white">Settings</h1>
        </div>
        <p class="text-gray-400">Configure system settings</p>
    </div>
    
    <!-- Settings Form -->
    <form method="POST" class="space-y-6">
        <div class="glass-card rounded-2xl p-6">
            <h2 class="font-semibold text-white mb-6 flex items-center">
                <i data-lucide="layout" class="w-5 h-5 mr-2 text-primary-400"></i>
                Site Settings
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label for="site_name" class="block text-sm font-medium text-gray-300 mb-2">
                        Site Name
                    </label>
                    <input type="text" id="site_name" name="site_name" 
                           value="{{ settings.site_name }}"
                           placeholder="Application Portal"
                           class="w-full bg-surface-800 border border-white/10 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-primary-500 focus:ring-1 focus:ring-primary-500 transition-colors">
                    <p class="text-xs text-gray-500 mt-1">Displayed in the header and page titles</p>
                </div>
            </div>
        </div>
        
        <!-- Quick Links -->
        <div class="glass-card rounded-2xl p-6">
            <h2 class="font-semibold text-white mb-6 flex items-center">
                <i data-lucide="link" class="w-5 h-5 mr-2 text-primary-400"></i>
                Quick Links
            </h2>
            
            <div class="space-y-3">
                <a href="{{ url_for('admin.users_list') }}" 
                   class="flex items-center justify-between p-4 rounded-xl bg-white/5 hover:bg-white/10 transition-colors">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="users" class="w-5 h-5 text-primary-400"></i>
                        <span class="text-white">Manage Users</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                </a>
                
                <a href="{{ url_for('admin.roles_list') }}" 
                   class="flex items-center justify-between p-4 rounded-xl bg-white/5 hover:bg-white/10 transition-colors">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="shield" class="w-5 h-5 text-primary-400"></i>
                        <span class="text-white">Manage Roles</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                </a>
                
                <a href="{{ url_for('admin.application_types') }}" 
                   class="flex items-center justify-between p-4 rounded-xl bg-white/5 hover:bg-white/10 transition-colors">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="message-square" class="w-5 h-5 text-indigo-400"></i>
                        <span class="text-white">Discord Settings</span>
                    </div>
                    <i data-lucide="chevron-right" class="w-5 h-5 text-gray-400"></i>
                </a>
            </div>
        </div>
        
        <!-- Actions -->
        <div class="flex justify-end">
            <button type="submit" 
                    class="px-8 py-3 rounded-xl bg-gradient-to-r from-primary-500 to-purple-600 hover:from-primary-400 hover:to-purple-500 text-white font-semibold transition-all duration-300 shadow-lg shadow-primary-500/25 hover:shadow-primary-500/40">
                <i data-lucide="save" class="w-4 h-4 inline mr-2"></i>
                Save Settings
            </button>
        </div>
    </form>
</div>
{% endblock %}
